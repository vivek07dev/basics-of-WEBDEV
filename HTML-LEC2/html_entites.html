<!--AN HTML ENTITIES are special characters that can be used in HTML to represent characters that have a special meaning in HTML or are not easily typed on a keyboard. They are represented by a combination of an ampersand (&), a character name or number, and a semicolon (;).-->
<!DOCTYPE html>
        <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
    <p>a &lt; b</p>
    <p>a &gt; b</p>
    <p>a &amp; b</p>
    <p>a &quot; b</p>
<h1>this is a &heartsuit;;</h1>
    </body>
    </html>
